# Builds docker/render/Dockerfile (Blender/bpy + Molecular Nodes, for the trajectory animations on a Salad GPU node)
# and pushes it to the eralpha-antidepressant-md package under render-<sha> and render tags. The smoke test renders a few stills of a
# synthetic peptide–ligand complex with Cycles on the CPU through the same render.py, and checks that the bpy wheel
# ships the CUDA/OptiX kernels the GPU node needs.
name: build-render

on:
  push:
    branches: [main]
    paths: [docker/render/**, analysis/anim/**, .github/workflows/build-render.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: render-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Free disk (the bpy wheel and its kernels are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eralpha-antidepressant-md" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (load locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/render/Dockerfile
          load: true
          tags: eralpha-render:ci
          cache-from: type=gha,scope=render
          cache-to: type=gha,scope=render,mode=max

      - name: Smoke test
        run: |
          docker run --rm eralpha-render:ci bash -n /opt/eralpha/run_render.sh
          # every bpy process leaves through os._exit (bpy 4.5 hangs in interpreter finalisation); timeouts fail fast
          timeout 300 docker run --rm eralpha-render:ci python -c "
          import os, pathlib, bpy
          # bpy.__file__ is Blender's Python package (4.5/scripts/modules/bpy), not the wheel root; the kernels are
          # under the version directory, 4.5/scripts/addons_core/cycles/lib
          root = pathlib.Path(bpy.utils.resource_path('LOCAL'))
          k = sorted(p.name for p in root.rglob('*') if p.suffix in ('.cubin', '.ptx', '.zst') and 'kernel' in p.name)
          print(len(k), 'Cycles GPU kernel files, e.g.', k[:4])
          ok = any('optix' in n for n in k) and any('sm_89' in n for n in k)
          print('kernels ok' if ok else 'no CUDA/OptiX kernels in the bpy wheel', flush=True)
          os._exit(0 if ok else 1)"
          mkdir -p smoke && timeout 1200 docker run --rm -v "$PWD/analysis/anim:/src:ro" -v "$PWD/smoke:/out" eralpha-render:ci bash -c "
          python /src/smoke_inputs.py /tmp/in && python -u /opt/eralpha/render.py /tmp/in /out --device CPU --samples 4 --stills 10,130 \
          && ls -la /out/smoke_frames"
          test -s smoke/smoke_frames/00130.png

      - uses: actions/upload-artifact@v4
        with:
          name: render-smoke-stills
          path: smoke/smoke_frames/*.png

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/render/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:render-${{ github.sha }}
            ${{ steps.name.outputs.image }}:render
          cache-from: type=gha,scope=render

      - name: Summary
        run: echo "### Image ${{ steps.name.outputs.image }}:render-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
