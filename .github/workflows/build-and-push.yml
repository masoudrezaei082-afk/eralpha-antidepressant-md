# Builds docker/Dockerfile (GROMACS + CUDA + run scripts + Salad job queue worker) and pushes it to GHCR. No secrets beyond the
# job's own GITHUB_TOKEN; R2 and Salad credentials never enter the image.
name: build-and-push

on:
  push:
    branches: [main]
    paths: [.dockerignore, docker/Dockerfile, docker/*.sh, docker/*.py, mdp/**, tests/job_server_test.sh, .github/workflows/build-and-push.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  GMX_VERSION: "2026.4"
  CUDA_TAG: cu129

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Free disk space (CUDA devel image + GROMACS build need ~20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eralpha-antidepressant-md" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=${{ env.GMX_VERSION }}-${{ env.CUDA_TAG }}-{{sha}}
            type=raw,value=${{ env.GMX_VERSION }}-${{ env.CUDA_TAG }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=eralpha-antidepressant-md
            org.opencontainers.image.description=GROMACS ${{ env.GMX_VERSION }} (CUDA 12.9, sm_89/sm_120) + Salad job queue worker for the ERα MD replicas

      - name: Build (load locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: GMX_VERSION=${{ env.GMX_VERSION }}
          load: true
          tags: eralpha-antidepressant-md:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (no GPU on the runner)
        run: |
          docker run --rm eralpha-antidepressant-md:ci gmx --version | tee version.txt
          grep -q "GPU support: *CUDA" version.txt
          grep -qE "CUDA targets: *89;120$" version.txt     # GROMACS 2026 lists compute capabilities, not sm_NN
          docker run --rm eralpha-antidepressant-md:ci sh -c 'test -x /usr/local/bin/salad-http-job-queue-worker && ls /opt/eralpha/mdp/md.mdp /opt/eralpha/bin/run_replica.sh'
          docker run --rm eralpha-antidepressant-md:ci bash -n /opt/eralpha/bin/run_replica.sh
          docker run --rm eralpha-antidepressant-md:ci bash -n /opt/eralpha/bin/queue_entry.sh
          docker inspect -f '{{json .Config.Cmd}}' eralpha-antidepressant-md:ci | grep -q queue_entry.sh
          # job_server.py's HTTP contract with the queue worker (stub run_replica.sh; exit code -> status, SIGTERM)
          docker run --rm -v "$PWD/tests:/t:ro" eralpha-antidepressant-md:ci bash /t/job_server_test.sh

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: GMX_VERSION=${{ env.GMX_VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Summary
        run: |
          {
            echo '### Image'
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo '```'
            grep -E "GROMACS version|GPU support|SIMD|CUDA driver|CUDA runtime" version.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
